[project]
name = "prime2mwgg"
version = "1.2.0"
description = "Metroid Prime 2: Echoes world for MultiworldGG"
requires-python = ">=3.12,<3.14"
dependencies = [
    "open-prime-rando[nod]==0.20.1",
    "dolphin-memory-engine>=1.3.0",
    "ppc-asm>=1.9.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "ruff>=0.6",
    "pytest>=8.0",
]

[tool.uv]
package = false

# Mirrors MultiWorldGG/ruff.toml, inlined rather than `extend`-ed: MultiWorldGG
# is gitignored (it's a symlink to a sibling checkout outside this repo, per
# README.md) and won't exist for a fresh clone or CI, and ruff hard-fails
# (exit 2, "No such file or directory") if `extend` points at a missing file.
# Re-sync by hand if MultiWorldGG's ruff.toml changes upstream. target-version
# is py312 here (not upstream's py313) to match this project's own
# requires-python floor.
[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["B", "C", "E", "F", "W", "I", "N", "Q", "UP", "RET", "RSE", "RUF", "ISC", "PLC", "PLE", "PLW", "T20", "PERF"]
ignore = [
    "B011",    # AP relies on `assert False` being optimized out in release builds
    "C901",    # no branch-complexity limit
    "N818",    # core AP violates this; not worth diverging on for one world
    "PLC0415", # local imports are fine/necessary in this codebase
    "PLC1802", # changes runtime behavior, unsafe to apply
    "PLC1901", # not an equivalent transformation here
    "PLE1141", # false positives on tuple dict keys
    "UP015",   # keep explicit "r" in open() calls
]

[tool.ruff.lint.per-file-ignores]
# tools/sync_randovania_data.py is a standalone dev CLI script; its
# print()s are the report it exists to produce, not debug leftovers.
"metroidprime2/tools/*" = ["T201"]
# WorldTestBase's own `options` attribute (MultiWorldGG/test/bases.py) is
# itself a plain `options: typing.Dict[str, typing.Any] = {}` with no
# ClassVar -- every world's test suite in the ecosystem overrides it the
# same unannotated way. Matching that convention here, not working around it.
"metroidprime2/test/*" = ["RUF012"]
# The manual tests are standalone CLI scripts whose whole job is to print
# the human-facing test book / build status; their print()s are the output,
# not debug leftovers (mirrors the tools/* exemption above).
"metroidprime2/test/manual/*" = ["T201"]
# Auto-generated by tools/sync_randovania_data.py from randovania's own
# (arbitrary-length) trick description text -- "Do not edit by hand" per its
# own docstring, so these long lines get regenerated, not manually wrapped.
"metroidprime2/options_tricks.py" = ["E501"]

# `Options`, `BaseClasses`, `NetUtils`, `worlds.*`, etc. are MultiWorldGG
# top-level modules, not pip packages -- they only exist via the
# `MultiWorldGG/` symlink (itself symlinked outside this repo) and are never
# `pip install`-ed here. mypy can't resolve or usefully typecheck them, so
# treat them as untyped (`Any`) instead of either failing to resolve them or
# dragging in all of MultiWorldGG's own dependencies (kivy, jinja2, ...) just
# to satisfy its internal imports.
[tool.mypy]
python_version = "3.12"
files = ["metroidprime2"]
exclude = ["__pycache__"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = [
    "BaseClasses",
    "CommonClient",
    "Fill",
    "Generate",
    "Main",
    "ModuleUpdate",
    "NetUtils",
    "Options",
    "Utils",
    "colorama",
    "kvui",
    "settings",
    "worlds",
    "worlds.*",
    "test",
    "test.*",
]
ignore_missing_imports = true
follow_imports = "skip"

# Convenience for running a single test file / editor test discovery from the
# repo root without `cd MultiWorldGG` first. `MultiWorldGG` is added to
# sys.path so `from Options import ...` etc. resolve at runtime -- but this
# still needs an interpreter that actually has MultiWorldGG's own deps
# installed (yaml, kivy, ...), e.g.:
#     MultiWorldGG/.venv/bin/python -m pytest metroidprime2/test/test_db_reader.py
# This uv-managed venv only has metroidprime2's own deps and mypy/ruff, so
# it can't run these tests itself (only lint/typecheck).
#
# This is NOT a substitute for the documented full-suite command (README.md):
#     cd MultiWorldGG && python -m pytest worlds/metroidprime2/test/
# Collected from here, `metroidprime2/` is importable both as a top-level
# package (via pytest's own rootdir walk) AND as `worlds.metroidprime2`
# (MultiWorldGG's world auto-discovery, through the symlink) -- two distinct
# module identities for the same files, which makes AutoWorld's registry
# raise "Game ... already registered" for any test that touches the world
# registry (confirmed: test_version.py fails this way run from here, passes
# under the README's MultiWorldGG-rooted invocation). Use single test files
# from here; use the README command for the full suite.
[tool.pytest.ini_options]
testpaths = ["metroidprime2/test"]
pythonpath = ["MultiWorldGG"]
