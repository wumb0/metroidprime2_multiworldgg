# Metroid Prime 2: Echoes player config for a 4-game multiworld:
# Metroid Prime, Metroid Prime 2: Echoes, Metroid Fusion, Metroid: Zero Mission
#
# Every option below is spelled out with a comment and set to its default
# value (see metroidprime2/options.py and the "Config options" section of
# README.md). You can delete any option you don't want to change -- leaving
# it out is equivalent to leaving it at its default.
name: MP2Echoes
description: "Metroid Prime 2: Echoes - all options at their defaults"
game: "Metroid Prime 2: Echoes"
requires:
  version: 0.6.3
"Metroid Prime 2: Echoes":
  # ------------------------------------------------------------------
  # Goal / item pool
  # ------------------------------------------------------------------

  # Which boss(es) must fall before the multiworld considers this slot's
  # game complete. This only changes when the goal is reported -- nothing
  # about the level itself is patched or skipped, so the escape sequence
  # and the Dark Samus 3 & 4 fight always play out normally regardless of
  # this setting if you keep playing past your goal condition.
  # Options: both_bosses, emperor_ing, keys
  #   both_bosses (default): complete once the Credits are reached, which
  #        requires defeating both Emperor Ing (Sky Temple/Sanctum) and
  #        Dark Samus 3 & 4 (Sky Temple Gateway), exactly like an
  #        unmodified playthrough.
  #   emperor_ing: complete as soon as Emperor Ing is defeated, without
  #        also requiring the Dark Samus 3 & 4 fight or the Credits.
  #   keys: complete as soon as Sky Temple Energy Controller is reached --
  #        which only requires opening the Sky Temple Gateway's key gate
  #        (see sky_temple_keys_required below) -- without fighting
  #        either boss.
  goal: both_bosses

  # How many of the 9 Sky Temple Keys are real, findable items -- shuffled
  # into the general pool, or pre-placed per sky_temple_keys_locations --
  # versus starting the game already pre-collected for free.
  # 0 means all 9 keys start pre-collected (an immediate escape to the
  # credits once the Sky Temple Gateway is reached). 9, the default, makes
  # every key findable, the same as a normal item.
  # Range: 0-9
  sky_temple_keys: 9

  # Where the findable Sky Temple Keys (see sky_temple_keys above) are
  # placed.
  # Options: off, all_bosses, all_guardians
  #   off (default): keys are shuffled into the general item pool like any
  #        other progression item. Works with any sky_temple_keys value.
  #   all_bosses: pre-places one key, in order, on each of the 9 boss/
  #        guardian pickup locations instead of shuffling them into the
  #        pool. Requires sky_temple_keys to be 9.
  #   all_guardians: pre-places the first 3 keys on the 3 dark temple
  #        guardians (Amorbis, Chykka, Quadraxis); any further findable
  #        keys (sky_temple_keys minus 3) are shuffled into the general
  #        pool, same as off. Requires sky_temple_keys to be at least 3.
  sky_temple_keys_locations: off

  # How many Sky Temple Keys must actually be held to unlock the Sky
  # Temple Gateway's ring of columns, independent of where (or whether)
  # sky_temple_keys makes them findable.
  # Must be no higher than sky_temple_keys -- silently clamped down to it
  # if higher.
  # Range: 1-9
  sky_temple_keys_required: 9

  # Whether the 9 Luminoth pillars in Sky Temple Gateway hint at where
  # each Sky Temple Key really is.
  # Options: disabled, scanned, precollected
  #   disabled: pillars show a non-hint instead of the vanilla riddles
  #        (which would mislead once keys are shuffled).
  #   scanned: scanning a pillar reveals that key's location (your own
  #        world or another player's) and sends the hint to the server,
  #        the same as any other in-game hint.
  #   precollected: every key hint is known from the start, without
  #        needing to scan anything.
  sky_temple_key_hints: scanned

  # Whether the 22 colored Luminoth lore holograms hint at where a
  # progression item can be found, the same way the Sky Temple Key
  # pillars do above -- scanning one to completion sends the hint to
  # the server.
  # Options: off, my_items, any
  #   off: holograms keep their vanilla lore text; nothing is hinted.
  #   my_items: each hologram names where one of YOUR OWN progression
  #        items is, in any player's world.
  #   any: also includes other players' progression items that landed
  #        in YOUR OWN world.
  # Only progression items are ever chosen, excluding Missile/Power Bomb/
  # Dark/Light/Beam Ammo Expansions, Energy Tanks, and Sky Temple Keys
  # (Sky Temple Keys are left entirely to the pillars above) -- all
  # indistinguishable-copy bulk items where "one of them is at location X"
  # isn't useful. Each remaining item is hinted at most once.
  translator_lore_hints: my_items

  # Which translator each of the 22 Luminoth lore holograms needs.
  # Options: vanilla, full_random
  #   vanilla: every hologram requires its region's vanilla translator.
  #   full_random: every hologram independently requires a random one of
  #        the four translator colors, and is recolored to match.
  translator_lore_rando: vanilla

  # Combine Dark Suit and Light Suit into two copies of a single
  # Progressive Suit item (first copy grants Dark Suit, second grants
  # Light Suit).
  # Options: true, false
  progressive_suit: true

  # Combine Grapple Beam and Screw Attack into two copies of a single
  # Progressive Grapple item (first copy grants Grapple Beam, second
  # grants Screw Attack).
  # Options: true, false
  progressive_grapple: false

  # Receiving any Missile Expansion also unlocks the Missile Launcher
  # itself, so expansions are usable before the launcher is found. Off
  # matches Randovania (expansions grant nothing without the launcher);
  # this also affects logic, not just the in-game grant.
  # Options: true, false
  missile_expansions_unlock_launcher: false

  # Every Missile Expansion that never reaches a location (cut to fit the
  # 119 locations, or replaced by a trap) adds 5 missiles to what the
  # Missile Launcher grants. Off removes those missiles from the seed,
  # reducing your maximum missile capacity. Affects logic too.
  # Options: true, false
  launcher_gains_removed_missiles: true

  # Receiving any Power Bomb Expansion also unlocks Power Bombs
  # themselves, so expansions are usable before the main Power Bomb
  # pickup is found. Off matches Randovania (expansions grant nothing
  # without the main pickup); this also affects logic, not just the
  # in-game grant.
  # Options: true, false
  power_bomb_expansions_unlock_power_bombs: false

  # On: 10 Dark Ammo Expansions + 10 Light Ammo Expansions, 20 ammo each
  # (matches vanilla/Randovania's default). Off: both are replaced by 20
  # unified Beam Ammo Expansions granting 10 Dark + 10 Light ammo each
  # (Randovania's "Split Beam Ammo Expansions" toggle, inverted) -- same
  # total ammo economy, fewer/bigger pickups.
  # Options: true, false
  split_beam_ammo: true

  # Optional single-copy pickups, each replacing a Missile Expansion in the
  # pool when on. Logic never requires them.
  # Options: true, false
  enable_unlimited_missiles_pickup: false
  enable_double_damage_pickup: false
  enable_unlimited_beam_ammo_pickup: false

  # Percentage of the pool's Missile Expansions replaced with traps (items
  # that do something bad when received). At least 13 Missile Expansions
  # always remain, since logic can ask for that many. 0 disables traps.
  # Options: 0 - 100
  trap_percentage: 0

  # Relative weight of each trap type among the traps placed by
  # trap_percentage; 0 disables that trap.
  #   Damage Trap:          removes a random share of your maximum energy (never kills)
  #   Ammo Depletion Trap:  zeroes Missiles, Power Bombs, Dark and Light ammo
  #   Freeze Trap:          freezes you at random moments for freeze_trap_duration seconds
  trap_weights:
    Damage Trap: 1
    Ammo Depletion Trap: 1
    Freeze Trap: 1

  # Least / most a Damage Trap removes, as a percentage of your maximum
  # energy; each trap picks a random whole percentage in between (swapped if
  # min is larger). A Damage Trap never kills you.
  # Options: 1 - 100
  damage_trap_min_percent: 25
  damage_trap_max_percent: 75

  # Seconds a Freeze Trap lasts. For that long you are frozen in ice at
  # random moments (every 5-20 s, for a random time between
  # freeze_trap_min_seconds and freeze_trap_max_seconds); mashing jump breaks
  # each freeze early. A second Freeze Trap received meanwhile extends it.
  # Options: 30 - 600
  freeze_trap_duration: 120

  # Shortest / longest a single freeze lasts, in seconds; each freeze picks a
  # random time in between (swapped if min is larger).
  # Options: 1 - 30
  freeze_trap_min_seconds: 4
  freeze_trap_max_seconds: 6

  # Traps in your own world look like a random ordinary pickup.
  # Options: true, false
  trap_disguise: false

  # ------------------------------------------------------------------
  # Logic
  # ------------------------------------------------------------------

  # Default difficulty of tricks logic is allowed to require. Applies to
  # every individual trick below that is left at "use_global" (0).
  # Options: disabled, beginner, intermediate, advanced, expert, ludicrous
  trick_level: disabled

  # How strictly damage requirements are calculated. Higher leniency
  # assumes less incoming damage, so logic needs fewer energy tanks /
  # less damage reduction to cross hazards.
  # Options: strict, medium, lenient
  damage_strictness: medium

  # How much energy (health) each Energy Tank is worth.
  # Range: 50-500
  energy_per_tank: 100

  # Damage per second taken in a dark world without appropriate suit
  # protection. NOTE: stored in TENTHS of a point per second, so the
  # default of 60 == 6.0 damage/second (matches randovania's
  # varia_suit_damage: 6.0).
  # Range: 10-600
  dark_aether_damage: 60

  # Damage per second taken in a dark world with the Dark Suit (but not
  # the Light Suit). NOTE: also stored in TENTHS of a point per second,
  # so the default of 12 == 1.2 damage/second (matches randovania's
  # dark_suit_damage: 1.2).
  # Range: 0-600
  dark_suit_damage: 12

  # Allow some Energy Tanks to be placed behind their own dark-world/
  # damage requirement, without another tank to make the trip safe.
  # Options: true, false
  dangerous_energy_tanks: false

  # ------------------------------------------------------------------
  # Combat
  # ------------------------------------------------------------------

  # How much Dark/Light Ammo the Dark Beam, Light Beam, and Annihilator
  # Beam cost per shot. cheap/expensive halve/double the uncharged,
  # charged, and charge-combo ammo costs; free zeroes them (the charge
  # combo's missile cost is untouched either way). Doesn't affect logic.
  # Options: vanilla, cheap, expensive, free
  beam_ammo_costs: vanilla

  # Which ammo pool(s) the Annihilator Beam draws from per shot. "both" is
  # vanilla (costs Dark and Light Ammo simultaneously); the other two make
  # it cost only one type. Doesn't affect logic.
  # Options: both, dark_only, light_only
  annihilator_ammo_source: both

  # Damage multiplier (percent) granted by the Double Damage item. Not in
  # the default item pool, so this only matters if a copy reaches you some
  # other way (e.g. start_inventory).
  # Range: 100-500
  double_damage_multiplier: 200

  # Percentage of incoming damage permanently negated by the Defense Up
  # custom item, on top of the Dark Aether/Dark Suit damage math above.
  # A flat value applied from the start of the game, not a stacking
  # pickup. Not modeled in logic -- can only make survival easier than
  # logic assumes, never harder.
  # Range: 0-90
  defense_up_damage_reduction: 0

  # ------------------------------------------------------------------
  # Entrance randomization
  # ------------------------------------------------------------------

  # Shuffle certain door locks (beam-colored doors, blast shields) among
  # a vetted pool of lock types instead of each door's vanilla lock.
  # Options: true, false
  door_lock_rando: false

  # When door_lock_rando is on, force every door of a Save Station room --
  # and the matching face on the far side, the one you shoot to get in --
  # to a Normal Door (any beam opens it), so a save is always reachable.
  # Can also remove a vanilla lock: a few save rooms ship with a Missile
  # Blast Shield or Dark Door, and those get normalized too. No effect
  # unless door_lock_rando is on.
  # Options: true, false
  normal_save_station_doors: true

  # Shuffle elevators into new two-way connections (every region stays
  # reachable, just not necessarily via the same elevator). The one-way
  # trip to Sky Temple and the intra-Aerie elevator are never shuffled.
  # Options: true, false
  elevator_rando: false

  # Shuffle the Light/Dark Aether portals into new connections within each
  # light/dark region pair, and make every portal two-way (including the
  # vanilla one-way arrival-only ones). Each portal keeps its own
  # beam-color requirement; only where it leads changes.
  # Options: true, false
  portal_rando: false

  # How each of the 17 translator gates' required color is chosen.
  # Options: vanilla, full_random, full_random_unlocked
  #   vanilla: every gate requires its vanilla translator color.
  #   full_random: every gate independently requires a random one of the
  #        four translator colors.
  #   full_random_unlocked: like full_random, but each gate may also
  #        independently come up "Unlocked" (open with just Scan Visor,
  #        no translator at all).
  translator_gate_rando: vanilla

  # Which pool the starting room is drawn from.
  # Options: vanilla, save_stations, anywhere
  #   vanilla: always Temple Grounds - Landing Site (matches every seed
  #        generated before this option existed).
  #   save_stations: one of the 18 save-station rooms across the game (9
  #        light / 9 dark).
  #   anywhere: one of 272 rooms -- every room Randovania's logic database
  #        considers a valid starting location (162 light / 110 dark),
  #        including e.g. boss arenas and rooms normally reached only via
  #        a one-way drop.
  # A dark-region start means taking Dark Aether damage from the moment
  # the game begins until a suit or safe zone is reached.
  starting_room: vanilla

  # Drops every dark-region room (Dark Agon Wastes, Dark Torvus Bog, Ing
  # Hive, Sky Temple, Sky Temple Grounds) from whichever pool
  # starting_room selects above, guaranteeing a light-world start. No
  # effect when starting_room is vanilla.
  # Options: true, false
  starting_room_light_world_only: false

  # ------------------------------------------------------------------
  # Tricks
  #
  # trick_level (above) sets the default for every trick below; set an
  # individual trick_* option to override just that one trick. Every
  # trick option shares the same scale, where "use_global" defers to
  # trick_level instead of picking a difficulty of its own.
  # Options: use_global, disabled, beginner, intermediate, advanced,
  #          expert, ludicrous
  # ------------------------------------------------------------------

  # Air Underwater: morph on the frame the camera crosses a water
  # surface to trick movement logic about whether Samus is underwater.
  trick_airunderwater: use_global

  # Bomb Space Jump: bomb jump + fast unmorph for an instant-unmorph
  # height boost.
  trick_bsj: use_global

  # Bomb Jump: chain bomb jumps to reach otherwise-unattainable heights.
  trick_bombjump: use_global

  # Bomb Slot without Bombs: activate some Bomb Slots with Darkburst/
  # Sunburst/Sonic Boom instead of Bombs.
  trick_bomblessslot: use_global

  # Boost Jump: morph, desync the camera, and Boost Ball jump for extra
  # distance.
  trick_boostjump: use_global

  # Combat: defeat enemies/bosses with fewer items and less health than
  # intended.
  trick_combat: use_global

  # Combat/Scan Dash: lock onto an enemy or scan point and strafe-dash
  # to preserve momentum across gaps.
  trick_dash: use_global

  # Extended Dash: strafe dash interrupted mid-jump for a large speed
  # boost.
  trick_edash: use_global

  # Jump Off Enemy: jump off enemies for extra height.
  trick_enemyhop: use_global

  # Instant Morph: morph near a wall/ceiling to skip the morph animation
  # and enter tunnels from the wrong side.
  trick_instantmorph: use_global

  # Invisible Objects: interact with objects (e.g. Dark Visor platforms)
  # without the visor needed to see them.
  trick_invisibleobjects: use_global

  # Knowledge: use non-obvious vulnerabilities of destructible objects
  # (e.g. Super Missiles on rubble meant for Screw Attack).
  trick_knowledge: use_global

  # Movement: catch-all for non-obvious precise movement and traversal
  # optimizations.
  trick_movement: use_global

  # Suitless Dark Aether: traverse Dark Aether, or tank Ingclaw/Ingstorm
  # damage, without the matching suit.
  trick_nosuits: use_global

  # Single Room Out of Bounds: leave a room's boundaries to reach
  # otherwise-unreachable areas within that room.
  trick_oob: use_global

  # Roll Jump: roll off a ledge into an instant unmorph and jump for
  # extra speed/distance.
  trick_rolljump: use_global

  # Screw Attack at Z-Axis: Screw Attack without Space Jump in rooms
  # where Samus's Z-position isn't 0 (mainly upper Sanctuary Fortress).
  trick_sanosj: use_global

  # Open Gates from Behind: open one-way gates from the wrong side via
  # scan posts or beam combos.
  trick_scanpost: use_global

  # Screw Attack into Tunnels/Openings: use Screw Attack's small hitbox
  # to fit into tunnels and tight gaps.
  trick_screwattacktunnels: use_global

  # Seeker Locks without Seeker Missiles: break some Seeker Locks using
  # standard Missiles + Screw Attack instead of Seeker Missiles.
  trick_seekerlesslocks: use_global

  # Slope Jump: jump into sloped surfaces for extra height via a physics
  # quirk.
  trick_slopejump: use_global

  # Standable Terrain: stand on unlikely scenery (small ledges, vines,
  # railings) to reach new places.
  trick_standableterrain: use_global

  # Terminal Fall Abuse: abuse fall-void triggers to warp into
  # unintended parts of a room.
  trick_terminalfall: use_global

  # Underwater Dash: hold L+R while swimming to lock speed and reach
  # some areas early.
  trick_underwaterdash: use_global

  # Wall Boost: boost on wall contact to partially scale terrain,
  # typically in Morph Ball tunnels.
  trick_wallboost: use_global

  # ------------------------------------------------------------------
  # Quality of Life
  # ------------------------------------------------------------------

  # Declining to save at a Save Station while holding L+R warps you back
  # to the starting room (Samus' ship in Landing Site, or wherever
  # starting_room chose). Declining without L+R held behaves exactly as
  # in vanilla.
  # Options: true, false
  warp_to_start: true

  # Elevators start pre-scanned so you don't need to scan the hologram
  # pillar before using them. Purely cosmetic/QoL -- Scan Visor is
  # always a starting item and elevators are never logically gated on
  # it, so disabling this only affects whether you have to scan first.
  # Options: true, false
  pre_scan_elevators: true

  # Allow moving while Scan Visor is locked onto a scan point, instead
  # of the game freezing your movement for the scan's duration. Purely
  # cosmetic/QoL; logic never assumes you can move during a scan
  # either way.
  # Options: true, false
  move_while_scanning: false

  # Once you have Morph Ball Bombs, pressing spring_ball_button in Morph
  # Ball jumps as high as a bomb jump, without laying a bomb. Only works
  # on the ground. Logic never requires it.
  # Options: true, false
  spring_ball: false

  # The button that triggers spring_ball. l_trigger means a full press,
  # past the click.
  # Options: c_stick_up, c_stick_down, c_stick_left, c_stick_right,
  #          d_pad_up, l_trigger
  spring_ball_button: c_stick_up

  # ------------------------------------------------------------------
  # Cosmetic
  # ------------------------------------------------------------------

  # Whether items belonging to other Echoes players show a matching
  # in-game model, or a generic model.
  # Options: none, match_game
  display_nonlocal_items: match_game

  # How much of the in-game map is revealed from the start. vanilla:
  # fills in as you explore. full_map: every room is drawn from the start
  # (rooms still need to be visited for name/details).
  # Options: vanilla, full_map
  map_visibility: vanilla

  # A dot on the map and minimap at every item location; a collected
  # item's dot disappears. off: no item dots ever. on: dots in rooms you've
  # visited or that a map station has revealed. always: dots in every room
  # the map draws (every dot from the start with map_visibility: full_map;
  # same as on with vanilla, since unvisited rooms aren't drawn).
  # Options: off, on, always
  item_map_dots: on

  # Show room names on the map for rooms not yet visited.
  # Options: true, false
  unvisited_room_names: true

  # ------------------------------------------------------------------
  # Common Archipelago options
  # ------------------------------------------------------------------

  # Share deaths with every other Death Link player in the multiworld.
  # Options: true, false
  death_link: false

  # Start with the given items already collected, removing that many
  # copies from the shuffled pool. Keys are exact in-game item names,
  # values are how many copies to start with.
  start_inventory_from_pool: {}

  # Standard core Archipelago option: nudges progression items earlier
  # in the item pool to reduce being stuck without checks to do.
  # Range: 0-99
  progression_balancing: 50

  # Standard core Archipelago option: whether generation must guarantee
  # every item/location is reachable, or only what's needed to reach
  # the goal.
  # Options: full, minimal
  accessibility: full
